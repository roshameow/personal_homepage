<style>
  .mermaid-diagram {
    max-width: 100%;
    margin: 0.85rem 0;
    overflow-x: auto;
  }
  .mermaid-diagram:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }
  .page-content pre.mermaid {
    margin: 0;
    padding: 0.25rem 0;
    text-align: center;
    background: transparent;
    overflow: visible;
    font-family: inherit;
  }
  .page-content pre.mermaid[data-processed] {
    white-space: normal;
  }
  pre.mermaid svg {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
  }
  .mermaid-diagram .cluster-label {
    font-weight: 700;
  }
  .mermaid-error {
    font-size: 0.85em;
    color: #9a3412;
  }
</style>
<script src="{{ '/assets/js/vendor/mermaid-11.17.2.min.js' | relative_url }}"></script>
<script>
(function () {
  'use strict';

  function normalizeMermaidSource(source) {
    // Mermaid 11 accepts A <-- "label" --- B but creates an INVALID edge.
    // Render the equivalent B -->|"label"| A, without editing the Markdown.
    var body = source.trimStart()
      .replace(/^---\r?\n[\s\S]*?\r?\n---(?:\r?\n|$)/, '')
      .replace(/%%\{[\s\S]*?\}%%/g, '')
      .replace(/^[\t ]*%%.*$/gm, '').trimStart();
    if (!/^(?:flowchart|graph)\b/.test(body)) return source;

    var started = false;
    var quoted = false;
    return source.replace(/[^\r\n]+/g, function (line) {
      if (!started && !/^\s*(?:flowchart|graph)\b/.test(line)) return line;
      started = true;
      var normalized = quoted ? line : line.replace(
        /^([\t ]*)([A-Za-z_][\w-]*)[\t ]*<--[\t ]*("[^"\r\n]*")[\t ]*---[\t ]*([A-Za-z_][\w-]*)([\t ]*;?[\t ]*(?:%%.*)?)$/,
        function (_, indent, left, label, right, suffix) {
          return indent + right + ' -->|' + label + '| ' + left + suffix;
        }
      );
      // Never rewrite an example inside a multiline quoted node label, and
      // never let quotes inside a %% comment affect the following lines.
      for (var i = 0; i < line.length; i++) {
        if (!quoted && line[i] === '%' && line[i + 1] === '%') break;
        if (line[i] === '"') quoted = !quoted;
      }
      return normalized;
    });
  }

  async function renderDiagrams() {
    var blocks = document.querySelectorAll('code.language-mermaid');
    if (!blocks.length) return;
    if (typeof mermaid === 'undefined') {
      blocks.forEach(function (code) {
        var original = code.closest('.highlighter-rouge') || code.closest('pre');
        if (!original) return;
        var message = document.createElement('p');
        message.className = 'mermaid-error';
        message.setAttribute('role', 'status');
        message.textContent = '图表组件加载失败，请刷新页面重试。Mermaid 源码已保留。';
        original.after(message);
      });
      return;
    }

    // Render every diagram as Mermaid, including diagrams with multiple subgraphs.
    // Disable the automatic pass so it cannot race with our explicit rendering.
    var skin = getComputedStyle(document.documentElement);
    function color(name, fallback) {
      return skin.getPropertyValue('--mermaid-' + name).trim() || fallback;
    }
    var background = color('background', '#ffffff');
    var text = color('text', '#000000');
    var border = color('border', '#cccccc');
    var nodeBorder = color('node-border', '#b8b9c0');
    var cluster = color('cluster-background', '#f9f9fa');
    var line = color('line', '#858795');
    var palettes = [
      ['#e4eaf0', '#f4f6f9', '#a5b3c2'], // slate blue
      ['#e8f0ea', '#f5f8f5', '#a8bcae'], // sage
      ['#f3ede3', '#faf7f2', '#c6b69c'], // sand
      ['#ebe8f1', '#f7f5fa', '#b5adc5'], // lavender
      ['#e4eeee', '#f3f8f8', '#a0baba']  // muted teal
    ].map(function (fallbacks, index) {
      return {
        node: color('palette-' + index + '-node', fallbacks[0]),
        cluster: color('palette-' + index + '-cluster', index === 0 ? cluster : fallbacks[1]),
        border: color('palette-' + index + '-border', fallbacks[2])
      };
    });
    var fontFamily = getComputedStyle(document.body).fontFamily ||
      '"Source Sans Pro", sans-serif';
    // Mermaid fixes label dimensions during layout. Wait for web fonts so a
    // later font swap cannot make the measured label box too small.
    if (document.fonts) await document.fonts.ready;

    var theme = {{ site.mermaid.theme | default: "base" | jsonify }};
    // The site's default follows its active skin. Explicit forest/dark/etc.
    // choices remain available for sites that deliberately select them.
    if (theme === 'default') theme = 'base';

    var config = {
      startOnLoad: false,
      securityLevel: 'strict',
      fontFamily: fontFamily,
      // Native SVG text avoids foreignObject clipping and article paragraph CSS.
      htmlLabels: false,
      flowchart: {
        inheritDir: true,
        curve: 'linear',
        nodeSpacing: 24,
        rankSpacing: 28,
        padding: 8,
        diagramPadding: 8,
        wrappingWidth: 180,
        // Nested cluster borders must start below the parent's full title line.
        subGraphTitleMargin: { top: 4, bottom: 12 }
      },
      theme: theme,
      themeVariables: theme === 'base' ? {
        fontFamily: fontFamily,
        fontSize: '14px',
        background: background,
        primaryColor: palettes[0].node,
        primaryTextColor: text,
        primaryBorderColor: nodeBorder,
        secondaryColor: palettes[1].node,
        secondaryTextColor: text,
        secondaryBorderColor: border,
        tertiaryColor: palettes[2].node,
        tertiaryTextColor: text,
        tertiaryBorderColor: border,
        lineColor: line,
        textColor: text,
        mainBkg: palettes[0].node,
        nodeBorder: nodeBorder,
        nodeTextColor: text,
        clusterBkg: palettes[0].cluster,
        clusterBorder: border,
        titleColor: text,
        defaultLinkColor: line,
        edgeLabelBackground: background,
        noteBkgColor: palettes[2].node,
        noteTextColor: text,
        noteBorderColor: border,
        actorBkg: palettes[0].node,
        actorBorder: nodeBorder,
        actorTextColor: text,
        actorLineColor: border,
        signalColor: line,
        signalTextColor: text
      } : { fontFamily: fontFamily }
    };

    function applyFlowchartPalette(svg) {
      if (theme !== 'base' || !/^flowchart/.test(svg.getAttribute('aria-roledescription') || '')) return;

      function tint(group, shapes, index, kind) {
        // Author-supplied classDef/style colors take precedence over auto accents.
        var customClass = Array.from(group.classList).some(function (name) {
          return !['node', 'default', 'cluster', 'clickable'].includes(name);
        });
        if (customClass || !shapes.length || shapes.some(function (shape) {
          return shape.style.getPropertyValue('fill') || shape.style.getPropertyValue('stroke');
        })) return;
        group.setAttribute('data-mermaid-palette', index);
        shapes.forEach(function (shape) {
          // Keep fallbacks in the SVG so exported diagrams retain their colors.
          if (shape.getAttribute('fill') !== 'none') {
            shape.style.fill = 'var(--mermaid-palette-' + index + '-' + kind + ', ' + palettes[index][kind] + ')';
          }
          shape.style.stroke = 'var(--mermaid-palette-' + index + '-border, ' + palettes[index].border + ')';
        });
      }

      var groups = Array.from(svg.querySelectorAll('g.cluster')).map(function (group, index) {
        var rect = group.querySelector('rect');
        return { group: group, rect: rect, bounds: rect && rect.getBoundingClientRect(), index: index % palettes.length };
      }).filter(function (entry) { return entry.rect; });
      // Mermaid's SVG stores clusters flat. Match by the actual layout so nodes
      // inherit their smallest enclosing group, including nested schedulers.
      var nodes = Array.from(svg.querySelectorAll('g.node')).map(function (node) {
        return { node: node, bounds: node.getBoundingClientRect() };
      });
      groups.forEach(function (entry) { tint(entry.group, [entry.rect], entry.index, 'cluster'); });
      groups.sort(function (a, b) { return a.bounds.width * a.bounds.height - b.bounds.width * b.bounds.height; });
      nodes.forEach(function (entry) {
        var box = entry.bounds;
        var parent = groups.find(function (group) {
          var bounds = group.bounds;
          return box.left >= bounds.left - 1 && box.right <= bounds.right + 1 &&
            box.top >= bounds.top - 1 && box.bottom <= bounds.bottom + 1;
        });
        var shapes = [];
        entry.node.querySelectorAll(':scope > .label-container').forEach(function (container) {
          // Rounded/hand-drawn shapes wrap paths in a group. Include the
          // container in the author-style check, then tint the actual paths.
          shapes.push(container);
          shapes.push.apply(shapes, container.querySelectorAll('path, rect, circle, ellipse, polygon, polyline'));
        });
        tint(entry.node, shapes, parent ? parent.index : 0, 'node');
      });
    }

    function hasNestedSubgraphs(source) {
      var depth = 0;
      return source.split(/\r?\n/).some(function (line) {
        if (/^\s*subgraph\b/.test(line)) return ++depth > 1;
        if (/^\s*end\s*(?:;|%%.*)?$/.test(line)) depth = Math.max(0, depth - 1);
        return false;
      });
    }

    for (var code of blocks) {
      var original = code.closest('.highlighter-rouge') || code.closest('pre');
      if (!original) continue;

      var wrapper = document.createElement('div');
      wrapper.className = 'mermaid-diagram';
      wrapper.tabIndex = 0;
      wrapper.setAttribute('role', 'region');
      wrapper.setAttribute('aria-label', 'Mermaid diagram (scroll horizontally)');

      var pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = normalizeMermaidSource(code.textContent);
      wrapper.appendChild(pre);
      original.replaceWith(wrapper);

      try {
        // Dagre reserves only half rankSpacing above a nested cluster. Keep
        // that space taller than its parent's title, without spreading out
        // the ordinary (non-nested) compact flowcharts.
        mermaid.initialize(Object.assign({}, config, {
          flowchart: Object.assign({}, config.flowchart, {
            rankSpacing: hasNestedSubgraphs(code.textContent) ? 56 : config.flowchart.rankSpacing
          })
        }));
        await mermaid.run({ nodes: [pre] });
        var svg = pre.querySelector('svg');
        if (svg && svg.viewBox.baseVal.width) {
          // Do not shrink labels to illegible text on narrow screens;
          // keep at least 90% of the natural size and scroll the diagram instead.
          svg.style.minWidth = (svg.viewBox.baseVal.width * 0.9) + 'px';
        }
        if (svg) applyFlowchartPalette(svg);
      } catch (error) {
        // A malformed diagram must not prevent other diagrams from rendering
        // or make the original source disappear.
        wrapper.replaceChildren(original);
        var message = document.createElement('p');
        message.className = 'mermaid-error';
        message.setAttribute('role', 'status');
        message.textContent = '图表渲染失败，已保留 Mermaid 源码。';
        wrapper.appendChild(message);
        console.warn('Mermaid diagram could not be rendered:', error);
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderDiagrams);
  } else {
    renderDiagrams();
  }
})();
</script>
