<style>
  .mermaid-list {
    display: flex;
    gap: 2em;
    flex-wrap: wrap;
    justify-content: center;
    font-family: "Source Sans Pro", sans-serif;
    margin: 1.5em 0;
  }
  .mermaid-list-col {
    min-width: 180px;
  }
  .mermaid-list-col h4 {
    margin: 0 0 0.4em 0;
    font-size: 0.95em;
    font-weight: 700;
    color: #34374C;
  }
  .mermaid-list-col ul {
    margin: 0;
    padding-left: 1.2em;
    line-height: 1.6;
  }
  pre.mermaid {
    text-align: center;
    background: transparent;
    padding: 1em 0;
    overflow: visible;
    font-family: "Source Sans Pro", sans-serif !important;
  }
  pre.mermaid svg {
    max-width: 100%;
    height: auto;
    overflow: visible;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('code.language-mermaid').forEach(function(code) {
      var text = code.textContent;
      var parent = code.closest('.highlighter-rouge') || code.parentElement;

      // 解析 subgraph 块
      var sgRe = /subgraph\s+\w+\["(.+?)"\]([\s\S]*?)end/g;
      var match, subgraphs = [];
      while ((match = sgRe.exec(text)) !== null) {
        var title = match[1];
        var body = match[2];
        var items = [];
        body.split('\n').forEach(function(line) {
          line = line.trim();
          var m = line.match(/^\w+\["(.+?)"\]/);
          if (m) items.push(m[1]);
        });
        if (items.length) subgraphs.push({ title: title, items: items });
      }

      if (subgraphs.length > 1) {
        // 有多列 subgraph → 渲染为 HTML 列表
        var div = document.createElement('div');
        div.className = 'mermaid-list';
        subgraphs.forEach(function(sg) {
          var col = document.createElement('div');
          col.className = 'mermaid-list-col';
          col.innerHTML = '<h4>' + sg.title + '</h4><ul>' +
            sg.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') +
            '</ul>';
          div.appendChild(col);
        });
        var wrapper = parent.closest('.highlighter-rouge') || parent;
        wrapper.parentNode.replaceChild(div, wrapper);
      } else {
        // 单图 → 正常用 Mermaid 渲染
        var pre = document.createElement('pre');
        pre.className = 'mermaid';
        pre.textContent = text;
        var wrapper = parent.closest('.highlighter-rouge') || parent;
        wrapper.parentNode.replaceChild(pre, wrapper);
      }
    });
    mermaid.run();
  });
</script>
