{%- assign mathjax_combo = site.mathjax.combo | default: 'tex-svg' -%}
{%- capture mathjax_root -%}{{ '/assets/js/vendor/mathjax/es5' | relative_url }}{%- endcapture -%}
<style>
    /* Only oversized equations get this wrapper; ordinary inline math stays inline. */
    .math-scroll {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding-block: 0.5em;
        scrollbar-width: thin;
    }
    .math-scroll > mjx-container[jax] {
        display: inline-block;
        margin: 0;
    }
    .math-scroll:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
    }
</style>
<script>
    function fitMathToColumn() {
        document.querySelectorAll('mjx-container').forEach(function (container) {
            var wrapper = container.parentElement.classList.contains('math-scroll') ? container.parentElement : null;
            var column = wrapper ? wrapper.parentElement : container.parentElement;
            while (column && ['inline', 'contents'].includes(getComputedStyle(column).display)) {
                column = column.parentElement;
            }
            if (!column) return;
            var style = getComputedStyle(column);
            var available = column.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            var ink = container.querySelector('mjx-math, svg');
            var width = (ink || container).getBoundingClientRect().width;
            if (width > available + 1) {
                if (!wrapper) {
                    wrapper = document.createElement('span');
                    wrapper.className = 'math-scroll';
                    wrapper.tabIndex = 0;
                    wrapper.setAttribute('role', 'region');
                    wrapper.setAttribute('aria-label', 'Mathematical formula; scroll horizontally to read all');
                    wrapper.title = 'Scroll horizontally to read the full formula';
                    container.before(wrapper);
                    wrapper.appendChild(container);
                }
            } else if (wrapper) {
                wrapper.replaceWith(container);
            }
        });
    }
    // Pin the engine, autoloaded TeX extensions, menu and fonts to local assets.
    window.MathJax = {
        loader: {
            paths: { mathjax: {{ mathjax_root | jsonify }} },
            load: ['[tex]/textmacros']
        },
        tex: {
            tags: {{ site.mathjax.tags | default: 'ams' | jsonify }},
            packages: { '[+]': ['textmacros'] },
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        chtml: {
            fontURL: {{ mathjax_root | append: '/output/chtml/fonts/woff-v2' | jsonify }}
        },
        startup: {
            pageReady: function () {
                return MathJax.startup.defaultPageReady().then(function () {
                    return document.fonts ? document.fonts.ready : undefined;
                }).then(function () {
                    fitMathToColumn();
                    var scheduled = false;
                    window.addEventListener('resize', function () {
                        if (scheduled) return;
                        scheduled = true;
                        requestAnimationFrame(function () {
                            scheduled = false;
                            fitMathToColumn();
                        });
                    });
                });
            }
        },
        options: {
            // Keep examples (including literal dollar signs) out of the typesetter.
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'annotation', 'annotation-xml']
        }
    };
</script>
<script id="MathJax-script" async src="{{ mathjax_root }}/{{ mathjax_combo }}.js"></script>
